name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v4
      - name: Ruoli e schema storage attesi dalle migrazioni
        run: |
          $PSQL -c "create role anon; create role authenticated; create role service_role;"
          $PSQL -c "create schema storage; create table storage.buckets (id text primary key, name text, public boolean, file_size_limit bigint, allowed_mime_types text[]);"
      - name: Applica le migrazioni
        run: for f in supabase/migrations/*.sql; do echo "== $f"; $PSQL -f "$f"; done
      - name: Test delle funzioni SQL
        run: $PSQL -f supabase/tests/complete_task_test.sql

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_URL: https://example.invalid

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check .
      - run: deno task check
      - run: deno task test
